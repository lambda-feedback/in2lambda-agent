# The spec the fake backend answers with for a sheet whose solutions are a file
# of their own. The same selectors run over both sources: the questions file
# holds no `## Solutions` heading, so nothing in it is a solution, and every
# solution comes from the second source.
ignore:   Header
question: Para text~'^[A-Z]'
part:     ListItem
solution: after Header text=Solutions, Para
strip:    ['^\([a-z]\) ', '^\d+\([a-z]\) ']
layout:   PartsSepSol
