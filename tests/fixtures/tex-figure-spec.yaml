# The spec for the sheet with a figure: the question is the paragraph that
# names the image, its parts are the items of the list under it, and its
# solutions are under the `Solutions` heading. A solution begins with its
# label, `1(a)`, so no solution matches `question`.
ignore:   Header
question: Para text~'^[A-Z]'
part:     ListItem
solution: after Header text=Solutions, Para
strip:    ['^\d+\([a-z]\) ']
layout:   PartsSepSol
