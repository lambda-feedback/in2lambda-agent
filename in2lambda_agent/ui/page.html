<!DOCTYPE html>
<!--
  The whole page: no build step, no framework. It posts /api/run and reads the
  stage lines of the conversion off /api/events. The server sends each event as
  JSON on a server-sent event stream, and ends the stream with the event that
  leaves the run idle: the `done` that carries the flags a person reads, or an
  `error`. The page counts the events it has read and opens the next stream
  with ?since=.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>in2lambda agent</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", sans-serif;
        margin: 2rem auto;
        max-width: 60rem;
        padding: 0 1rem;
      }
      h1 { font-size: 1.4rem; }
      label { display: block; margin: 0.4rem 0; }
      label span { display: inline-block; width: 9rem; }
      input[type="text"], select { width: 28rem; }
      input[type="number"] { width: 5rem; }
      pre {
        background: #f4f4f4;
        max-height: 24rem;
        overflow: auto;
        padding: 0.8rem;
        white-space: pre-wrap;
      }
      #entries {
        border: 1px solid #ddd;
        list-style: none;
        margin: 0 0 0 9rem;
        max-height: 12rem;
        overflow: auto;
        padding: 0.4rem 0.8rem;
        width: 28rem;
      }
      #entries a { color: #06c; cursor: pointer; }
      #where { margin: 0.4rem 0 0.2rem 9rem; }
      .flag { border-top: 1px solid #ddd; margin-top: 1rem; padding-top: 1rem; }
      .flag h3 { font-size: 1rem; margin: 0; }
      .error { color: #b00; }
      .note { color: #666; }
    </style>
  </head>
  <body>
    <h1>in2lambda agent</h1>
    <p class="note">
      A development harness, on this machine only. One run at a time.
    </p>

    <label><span>Source</span>
      <input type="text" id="source" placeholder="/path/to/sheet.pdf" />
    </label>
    <p class="note" id="where"></p>
    <ul id="entries"></ul>
    <label><span>Solutions file</span>
      <input type="text" id="solutions" placeholder="the one beside the source" />
    </label>
    <label><span>Filter file</span>
      <input type="text" id="filter" placeholder="route B runs only with one" />
    </label>
    <label><span>Write filter</span>
      <input type="checkbox" id="write-filter" />
    </label>
    <label><span>Out directory</span>
      <input type="text" id="out" value="out" />
    </label>
    <p><button id="go">Go</button> <span id="said" class="error"></span></p>

    <pre id="log"></pre>
    <div id="flags"></div>
    <div id="links"></div>

    <script>
      const byId = (id) => document.getElementById(id);
      let stream = null;
      let read = 0;

      // The picker lists one directory at a time, starting at the corpus: a
      // folder descends into it, a document fills the box above.
      async function browse(path) {
        const asked = path ? "?path=" + encodeURIComponent(path) : "";
        const answer = await fetch("/api/sources" + asked);
        const listing = await answer.json();
        if (!answer.ok) {
          line("error     " + listing.error);
          return;
        }
        byId("where").textContent = listing.path;
        const entries = byId("entries");
        entries.innerHTML = "";
        if (listing.up) {
          entries.append(entry("../", () => browse(listing.up)));
        }
        for (const folder of listing.folders) {
          entries.append(entry(folder.name + "/", () => browse(folder.path)));
        }
        for (const one of listing.documents) {
          entries.append(
            entry(one.name, () => { byId("source").value = one.path; })
          );
        }
      }

      function entry(label, chosen) {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.textContent = label;
        link.onclick = chosen;
        item.append(link);
        return item;
      }

      function line(text) {
        byId("log").textContent += text + "\n";
        byId("log").scrollTop = byId("log").scrollHeight;
      }

      async function go() {
        const body = {
          source: byId("source").value,
          solutions: byId("solutions").value,
          filter: byId("filter").value,
          write_filter: byId("write-filter").checked,
          out: byId("out").value,
        };
        const answer = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!answer.ok) {
          byId("said").textContent = (await answer.json()).error;
          return;
        }
        byId("said").textContent = "";
        byId("log").textContent = "";
        byId("flags").innerHTML = "";
        byId("links").innerHTML = "";
        read = 0;
        watch();
      }

      function watch() {
        if (stream) stream.close();
        stream = new EventSource("/api/events?since=" + read);
        stream.onmessage = (message) => show(JSON.parse(message.data));
      }

      function show(event) {
        read += 1;
        // The server ends the stream after each of these two, so the page
        // closes its own end rather than letting EventSource reconnect.
        if (["done", "error"].includes(event.type)) stream.close();
        if (event.type === "stage") {
          line(event.name.padEnd(9) + " " + event.message);
        } else if (event.type === "done") {
          flagged(event);
          linksTo(event.links);
        } else if (event.type === "error") {
          line("error     " + event.message);
          byId("said").textContent = event.message.split("\n")[0];
        }
      }

      // The flags are what a person reads after the build: the field, why it
      // is flagged, and each route's reading of it where the two disagree.
      function flagged(event) {
        const where = byId("flags");
        where.innerHTML = "<h2>Flags</h2>";
        if (!event.flags.length) {
          where.innerHTML += "<p class='note'>No field was flagged.</p>";
        }
        for (const one of event.flags) {
          const block = document.createElement("div");
          block.className = "flag";
          block.innerHTML = "<h3></h3><p class='note'></p>";
          block.querySelector("h3").textContent = one.field;
          block.querySelector("p").textContent = one.reason;
          if (one.a && one.b) {
            block.append(reading("A: ", one.a), reading("B: ", one.b));
          } else {
            block.append(reading("", one.a || one.b));
          }
          where.append(block);
        }
        const counts = document.createElement("p");
        counts.textContent = event.fields + ", " + event.tokens + " tokens";
        where.append(counts);
        if (event.route_b_error) {
          const failed = document.createElement("p");
          failed.className = "error";
          failed.textContent = "route B failed: " + event.route_b_error;
          where.append(failed);
        }
      }

      function reading(label, text) {
        const block = document.createElement("pre");
        block.textContent = label + text;
        return block;
      }

      function linksTo(links) {
        const where = byId("links");
        where.innerHTML = "<h2>Written</h2>";
        if (!links.length) {
          where.innerHTML += "<p class='note'>The run wrote no files.</p>";
          return;
        }
        for (const one of links) {
          const link = document.createElement("a");
          link.href = one.url;
          link.textContent = one.label;
          link.style.marginRight = "1rem";
          where.append(link);
        }
      }

      byId("go").onclick = go;
      browse();
    </script>
  </body>
</html>
