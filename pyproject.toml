[tool.poetry]
name = "in2lambda-agent"
version = "0.1.0"
description = "Turns a PDF, docx, tex or md file into a validated Lambda Feedback set"
authors = []
license = "MIT"
readme = "README.md"
packages = [{ include = "in2lambda_agent" }]

[tool.poetry.dependencies]
python = "^3.10"
# From git until a release carries the API the agent needs. The convert extra
# pulls in panflute, which in2lambda.main.runner needs to read a document.
in2lambda = { git = "https://github.com/lambda-feedback/in2lambda.git", branch = "dev", extras = [
  "convert",
] }
python-dotenv = "^1.0"
# For Mathpix. Its MockTransport lets the tests fake every request without a
# credential or a monkeypatch.
httpx = "^0.27"

[tool.poetry.scripts]
in2lambda-agent = "in2lambda_agent.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.1,<10.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
